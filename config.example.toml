# sysdeck configuration
#
# Copy this file to $XDG_CONFIG_HOME/sysdeck/config.toml, or to
# ~/.config/sysdeck/config.toml when XDG_CONFIG_HOME is unset.
#
# Every setting is shown at its built-in default and commented out. If a value
# cannot be read it is reported on stderr and the default is used instead.


[list]
# How many rows to show at once. The window grows with the rows, and a manual
# page or a context menu is drawn underneath, so a large number might make the
# window too tall in some instances.
#
# lines = 8


[recommendations]
# With the `--recommendations` flag the list shows the entries you have picked
# at least twice whenever the text box is empty.
#
# How many entries each of them adds to the list at most.
#
# max_per_subroutine = 5


[terminal]
# The terminal that executables are opened in, as the command and the argument
# that takes the program to run. sysdeck usually work this out by itself,
# honoring $TERMINAL first, but if the "magic" doesn't do its job feel free to
# configure your terminal here.
#
# A disk entry whose handler runs in a terminal, such as a file opening in
# an editor, is using this setting, too.
#
# command = ["ghostty", "-e"]


[keys]
# The manual page sections, where {n} is the section number. F{n} means the
# function keys, so Alt+F5 shows man 5. Write {n} on its own for the number
# row, as in "Alt+{n}", which however collides with the context menu below when
# both use the same modifier.
#
# Note: GNOME and KDE bind Alt+F1, Alt+F2 and Alt+F4 themselves and grab those
# keys before sysdeck sees them. If you are using either of these WMs it's
# probably best to switch these to "Ctrl+F{n}".
#
# manual = "Alt+F{n}"

# This key must be held to show the context menu of the selected entry, whose
# rows are then run with the numbers 1 to 9. You'd want to use a modifier here,
# since it is held and not just pressed.
#
# context = "Alt"

# This keybinding switches back from any other mode to the general search.
#
# search = "Ctrl+f"

# This keybinding switches from the general search to the list of Sway windows.
#
# windows = "Ctrl+t"

# This keybinding switches from the general search to the clipboard history.
#
# history = "Ctrl+h"

# This keybinding switches from the general search to the disk browser.
#
# disk = "Ctrl+d"

# This keybinding switches from the general search to the whats prompt.
#
# whats = "Ctrl+w"

# This keybinding switches from the general search to the LLM prompt.
# Pressing it again while already in LLM mode changes to the next provider in
# the dropdown.
#
# llm = "Ctrl+l"

# This keybinding starts a new conversation in LLM mode.
#
# reset = "Ctrl+n"


[index]
# How old an index may get before it is rebuilt, in minutes. The rebuild runs
# in the background, hence queries go against the previous index while it does.
# A bookmark adapter is rebuilt whatever its age when this file has been written
# since the index was built, so a newly configured file is read straight away.
#
# max_age_minutes = 60


[index.apps]
# Per index to override of the global max_age_minutes value.
#
# max_age_minutes = 240


[index.bins]
# Per index to override of the global max_age_minutes value.
#
# max_age_minutes = 60


[extensions.man]
# Show the manual page of the selected executable underneath the list.
#
# enable = true


[extensions.preview]
# Show a preview of the selected entry underneath the list. This works for
# images, text, audios (soon), videos (soon), PDFs (soon).
#
# enable = true

# How tall the picture or the text box may get, in pixels. Keep in mind that
# this is added to the height of the list.
#
# height = 200

# The largest file size that is previewed, in bytes. Anything above this is
# still listed, but is not read/previewed.
#
# max_bytes = 10485760


[sources.sway]
# Whether the open sway windows can be searched, which is what the `windows` key
# above switches to.
#
# Note: This one has no default. When $SWAYSOCK is set it is enabled, otherwise
# it is off. Setting it overrides this behavior.
#
# enable = true


[clipboard]
# Integrated clipboard manager similar to `cliphist`.
#
# Nothing is recorded until `wl-paste` is configured to run it, e.g. via
# ~/.config/sway/config:
#
#   exec wl-paste --watch sysdeck --clipboard-capture > /dev/null
#
# Turning this off hides the history and stops it being searched. It does not
# stop `--clipboard-capture` writing it.
#
# enable = true

# How many entries are kept. The oldest are removed first, sorted by the last
# time a thing was copied.
#
# max_items = 750

# How old an entry may get before it is dropped, in days. Set it to 0 to keep
# entries however old they are.
#
# max_age_days = 30

# The maximum size that is stored, in bytes. Anything above this is
# ignored, so if you copy a file that's larger it won't end up in the clipboard
# history.
#
# Note: 5 MB is conservative limit, but if you work a lot with large files
# (e.g. photographs straight off a phone) you'll likely want to increase this
# value. Also, do not forget to increase `[extensions.preview] max_bytes` with
# it, if you want to preview these files.
#
# max_size_bytes = 5242880

# The shortest selection that is stored, in bytes. Raise it if single
# characters in the history bother you.
#
# min_length = 0

# Note: A selection marked as sensitive, which is how a password manager
# copies a password, is never stored. `wl-copy --clear` deletes the newest
# entry, so clearing the clipboard after a password takes it out of the history
# as well.


[screenshot]
# Enable screenshot subroutine. It can take a screenshot of a region, a window
# or a whole screen.
#
# Note: This feature requires a compositor that does wlr-screencopy and
# wlr-layer-shell, which is Sway, river, Wayfire, and a few others, and it is
# off outside Wayland.
#
# Type "screenshot" to get the entry, hold Alt for its context menu.
#
# enable = true

# Where the file is written. If this is unset it uses the XDG pictures
# directory (usually ~/Pictures). The directory is created if it is missing.
#
# directory = "~/cloud/photos/screenshots"

# The name of the file, with the % variables of date(1). The format is decided
# by the extension, which can either be .jpg and .jpeg for a JPEG, or .png for
# a PNG.
#
# Note: A separator writes into subdirectories, as in
# "%Y/%m/screenshot_%d-%H%M%S.png".  A name that is already taken gets -2, -3
# and so on.
#
# filename = "screenshot_%Y-%m-%d-%H%M%S.png"

# What is copied after the file is written. "image" copies the picture itself,
# "path" copies the absolute path to the saved image, and "none" copies nothing.
#
# Note: Copying needs wl-copy.
#
# clipboard = "none"

# Whether the mouse pointer should be part of the picture.
#
# cursor = false


[llm]
# Ask a configured LLM things. Ctrl+L switches to LLM mode (unless configured
# otherwise), and the `--llm` flag starts sysdeck with it.
#
# Pressing Escape while an answer is being written stops the request and keeps
# the text that arrived. A second Escape closes sysdeck.
#
# Note: The pane keeps the conversation, so a follow-up question carries the
# earlier turns with it for context awareness. A long conversation will cost
# more tokens. Ctrl+N starts a new conversation.
#
# Note: LLM mode will not be available if there is no provider
# configuration (below).

# How tall the answer pane may get, in pixels.
#
# height = 300

# Providers
#
# Note: The key is read from the environment, not from this file. Set
# `api_key_env` to name a variable, or leave it out to use the provider's
# default, which is GOOGLE_API_KEY, OPENAI_API_KEY or ANTHROPIC_API_KEY.

# [[llm.gemini]]
# name = "flash"
# model = "gemini-2.5-flash"

# [[llm.openai]]
# name = "local"
# model = "Qwen/Qwen3-4B-GGUF:Q4_K_M"
#
# Note: `base_url` points the OpenAI client at anything with a compatible API,
# such as llama.cpp's llama-server, Ollama or Hugging Face Inference.
# Leave it out for OpenAI itself.
#
# base_url = "http://192.168.122.1:8080/v1"

# [[llm.openai]]
# name = "gpt"
# model = "gpt-4o"

# [[llm.anthropic]]
# name = "sonnet"
# model = "claude-sonnet-4-6"
#
# Note: `max_tokens` is the answer limit, which Anthropic requires.
#
# max_tokens = 4096


[bookmarks.markdown]
# Collect bookmarks from a list of markdown files. Both `[name](https://...)`
# and `[name][ref]` together with its `[ref]: https://...` definition are
# indexed, with the link text as the name. Images, links inside code and links
# that are not absolute, such as `./other.md` or `#section`, are not indexed.
#
# Choosing a bookmark opens it with $BROWSER when that is set, and with the
# desktop handler for the URL scheme otherwise.
#
# files = ["~/notes/links.md", "/srv/wiki/bookmarks.md"]

# Per adapter override of the global max_age_minutes value.
#
# max_age_minutes = 60


[bookmarks.chromium]
# Collect bookmarks from the `Bookmarks` file that Chromium/Chromium-based
# browsers write. The file is opened read-only (not locked), so a running
# browser is not affected. Folder names are indexed and take part in the search.
#
# The paths below are the default profile of the common browsers. A second
# profile is usually called `Profile 1`, a third `Profile 2`, etc. A browser
# installed as a Flatpak keeps the same layout under ~/.var/app/<app-id>/config.
#
# files = [
#   "~/.config/chromium/Default/Bookmarks",
#   "~/.config/google-chrome/Default/Bookmarks",
#   "~/.config/BraveSoftware/Brave-Browser/Default/Bookmarks",
#   "~/.config/microsoft-edge/Default/Bookmarks",
#   "~/.config/vivaldi/Default/Bookmarks",
#   "~/.config/opera/Bookmarks",
# ]

# Per adapter override of the global max_age_minutes value.
#
# max_age_minutes = 60


[bookmarks.firefox]
# Collect bookmarks from the `places.sqlite` database that Firefox/Firefox-based
# browsers keep in the profile directory. The database is opened read-only,
# hence a running browser is not affected. Folder names and
# the tags are indexed and take part in the search.
#
# `<profile>` is a directory with a random name, such as
# `g0yfptzh.default-release`, so these paths have to be completed by hand.
#
# Note: Firefox from 2025 onward keeps its profiles under ~/.config/mozilla,
# older ones and most forks use a directory of their own in the home directory.
# Tor Browser and Mullvad Browser keep the profile inside the install directory
# under Browser/TorBrowser/Data/Browser/profile.default.
#
# files = [
#   "~/.config/mozilla/firefox/<profile>/places.sqlite",
#   "~/.mozilla/firefox/<profile>/places.sqlite",
#   "~/.mozilla/icecat/<profile>/places.sqlite",
#   "~/.librewolf/<profile>/places.sqlite",
#   "~/.waterfox/<profile>/places.sqlite",
#   "~/.floorp/<profile>/places.sqlite",
#   "~/.zen/<profile>/places.sqlite",
#   "~/.firedragon/<profile>/places.sqlite",
#   "~/.moonchild productions/pale moon/<profile>/places.sqlite",
# ]

# Per adapter override of the global max_age_minutes value.
#
# max_age_minutes = 60


[disk]
# Index the files and folders in the configured paths.
#
# `id` and `path` are required, the rest is optional. The id names the location
# in the index. The path accepts ~ and environment variables, and any XDG_*_DIR
# that the session doesn't export is read from ~/.config/user-dirs.dirs.
#
# Note: The walk follows a symlink to a file, but it does not enter a symlinked
# directory.
#
# locations = [
#   { id = "documents", path = "~/documents", max_age_minutes = 20 },
#   { id = "shots", path = "$XDG_PICTURES_DIR/screenshots", only = ["image/*"] },
#   { id = "code", path = "~/projects", exclude = ["node_modules", "*.o"] },
# ]

# A location can also be written as a table of its own:
#
# [[disk.locations]]
# id = "documents"
# path = "~/documents"

# Per location override of the global max_age_minutes value.
#
# max_age_minutes = 60

# Index only these mimetypes, either exactly or as a wildcard for the whole
# type. A folder is "inode/directory". Everything is indexed when this is left
# out.
#
# only = ["image/jpeg", "image/png", "video/*"]

# Leave out what matches one of these globs. A pattern is matched against the
# `path` and against the name on its own, e.g. "node_modules" excludes any item
# named like that at any depth, but "build/tmp" only excludes the specific item.
#
# Note: * and ? do not cross a separator.
#
# exclude = ["node_modules", "*.log"]

# Whether dotfiles and dot directories are indexed.
#
# hidden = false
